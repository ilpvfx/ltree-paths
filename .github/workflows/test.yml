name: test
run-name: Build & test for ${{ github.head_ref }}

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'

jobs:
  #
  # Test the Rust & Python modules
  #
  rust-python-test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref }}-python
      cancel-in-progress: true
    steps:
      # We need the source.
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.head_ref }}'
      # We need Python and Rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9' 
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # We need lockfiles to hash on, and we do not have them in our repo, because they are libraries
      # TODO: maybe there's a better way.
      - name: Generate lockfiles
        run: |
          cd ltree_rust
          cargo generate-lockfile
          cd ..
          cd ltree_pyo3
          cargo generate-lockfile
      # Cache Rust and Python pip. We set restore-keys to reuse the latest cache even if the key was
      # not found. This will cut down install time for all the dependencies that did not change.
      - name: Setup Cache for Rust & Python
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            **/ltree_pyo3/target/
            **/ltree_rust/target/
             ~/.cache/pip
          key: ${{ runner.os }}-rustpy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rustpy-
      # Test the Rust package first
      - name: Test Rust
        run: |
          cd ltree_rust
          export RUSTFLAGS='-D warnings'
          cargo test --release --all-features
      # Maturin makes packaging easier
      - name: Test Python
        run: |
          cd ltree_pyo3
          python3 -m venv .venv
          source .venv/bin/activate
          pip install maturin
          maturin develop --extras tests
          pytest .
  #
  # Test Go
  #
  go-test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref }}-go
      cancel-in-progress: true
    steps:
      # We need the source.
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.head_ref }}'
      # Let Go rip
      - name: Get Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'ltree_go/go.mod'
          cache-dependency-path: |
            ltree_go/go.sum
      - name: Run Go tests
        run: |
          cd ltree_go
          go test
  #
  # Test Cpp
  #
  cpp-test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref }}-cpp
      cancel-in-progress: true
    steps:
      # We need the source.
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.head_ref }}'
      # Prerequisites
      - name: Get Build system
        run: |
          sudo apt install cmake g++-12 cmake ninja-build
      # Build the C++ sources
      - name: Build and test
        run: |
          mkdir build
          cd build
          cmake -D CMAKE_C_COMPILER=gcc-12 -D CMAKE_CXX_COMPILER=g++-12 -D BUILD_TESTING=ON ../ltree_cpp/.
          make

          # Test the install
          sudo make install

          # Make sure we can easily access common/
          cd ..

          # Test the lib
          echo -e "Catch test output" >> $GITHUB_STEP_SUMMARY
          echo -e "\x60\x60\x60" >> $GITHUB_STEP_SUMMARY

          build/src/ltree_test >> $GITHUB_STEP_SUMMARY

          echo -e "\x60\x60\x60" >> $GITHUB_STEP_SUMMARY