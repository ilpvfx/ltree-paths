name: release-check
run-name: Release check on ${{ github.head_ref }}

on:
  release:
    types: [created]
  pull_request:
    branches:
      - 'release/**'

jobs:
  version-extract:
    uses: ./.github/workflows/version-extract.yml
    with:
      string: ${{ github.head_ref }}

  version-check:
    runs-on: ubuntu-latest
    needs: [ version-extract ]
    steps:
      # We need the source for check-toml
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.head_ref }}'
      # Python 3.11 for tomllib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
      - name: Check project versions
        run: |
          python .github/check-toml.py compare ltree_rust/Cargo.toml package.version ${{ needs.version-extract.outputs.full }}
          echo "✅ Rust package " >>  $GITHUB_STEP_SUMMARY
          
          python .github/check-toml.py compare ltree_pyo3/Cargo.toml package.version ${{ needs.version-extract.outputs.full }}
          echo "✅ Python/Rust PyO3 package" >>  $GITHUB_STEP_SUMMARY
          
          # Pypa is not fully SemVer compatible, so we have to coax the pre-release tags into their format.
          # NOTE: Pypa is also quite particular about the kind of tags we can have on a version.
          PRE_RELEASE=${{ needs.version-extract.outputs.pre_release }}
          PYPA_SYNTAX=${{ needs.version-extract.outputs.major }}.${{ needs.version-extract.outputs.minor }}.${{ needs.version-extract.outputs.patch }}
          if [ "$PRE_RELEASE" != "" ]; then
            PYPA_SYNTAX=$PYPA_SYNTAX.$PRE_RELEASE
          fi
          python .github/check-toml.py compare ltree_pyo3/pyproject.toml tool.poetry.version $PYPA_SYNTAX
          echo "✅ Python package" >>  $GITHUB_STEP_SUMMARY




