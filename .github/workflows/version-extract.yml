#
# This action tries to extract a restricted SemVer from a branch name or tag. It is very opinionated.
#
# It requires a version have the format 
#
#   [release/]x.y.z
#
# or 
#
#   [release/]x.y.z-prerelease.tags
#
# Short identifiers such as x.y or similar wont work, by design. Don't be lazy. A build tag is not
# supported.
#
# If the regex is not a match, the job fails. You can use this with as needs-dependency to make sure
# a version string is adhering to this format.
#

name: Check and Extract Version

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    outputs:
      major:
        value: "${{ jobs.check.outputs.major }}"
      minor:
        value: "${{ jobs.check.outputs.minor }}"
      patch:
        value: "${{ jobs.check.outputs.patch }}"
      pre_release:
        value: "${{ jobs.check.outputs.pre_release }}"
      full:
        description: "The parsed semver string in its entirety"
        value: "${{ jobs.check.outputs.full }}"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.version.outputs.MAJOR }}
      minor: ${{ steps.version.outputs.MINOR }}
      patch: ${{ steps.version.outputs.PATCH }}
      pre_release: ${{ steps.version.outputs.PRE_RELEASE }}
      full: ${{ steps.version.outputs.FULL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.ref }}'
      - name: Extract version info from branch ref
        id: version
        run: |
          VERSION_DATA=`cat VERSION`

          REGEX="^(release\/)?(([0-9]+)\.([0-9]+)\.([0-9]+)(-([a-zA-Z_.0-9]+))?)$"
          if [[ $VERSION_DATA =~ $REGEX ]]
          then
            MAJOR=${BASH_REMATCH[3]}
            MINOR=${BASH_REMATCH[4]}
            PATCH=${BASH_REMATCH[5]}
            PRE_RELEASE=${BASH_REMATCH[7]}
            FULL=${BASH_REMATCH[2]}
            echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
            echo "MINOR=$MINOR" >> $GITHUB_OUTPUT
            echo "PATCH=$PATCH" >> $GITHUB_OUTPUT
            echo "PRE_RELEASE=$PRE_RELEASE" >> $GITHUB_OUTPUT
            echo "FULL=$FULL" >> $GITHUB_OUTPUT
            echo "Version extract: ✅ ($FULL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Version extract: ❌ failure due to unsupported syntax: $VERSION_DATA" >> $GITHUB_STEP_SUMMARY
            exit 666
          fi
