[project]
name = "pyltree"
requires-python = ">= 3.8"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project.optional-dependencies]
tests = [
  "pytest",
]

[tool.maturin]
# This indicates that our python package is actually in a subdirectory.
python-source = "python"
# This names our Rust module such that it is a submodule to the Python module.
module-name = "pyltree.pyltree_core"

[tool.poetry]
name = "pyltree"
version = "1.0.0.rc1"
description = "Fast LTree Paths for Python"
authors = [
  "Simon Otter <simon.otter@ilpvfx.com>",
]
readme = "../README.md"

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"