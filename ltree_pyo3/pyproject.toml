[project]
name = "pyltree"
# Taken from Cargo.toml by maturin.
dynamic = ["version"]
description = "Fast LTree Paths for Python"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Simon Otter", email = "simon.otter@ilpvfx.com" },
]
requires-python = ">= 3.9"
keywords = ["ltree", "postgresql", "postgres", "path", "hierarchy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/ilpvfx/ltree-paths"
Issues = "https://github.com/ilpvfx/ltree-paths/issues"

[project.optional-dependencies]
tests = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
# This indicates that our python package is actually in a subdirectory.
python-source = "python"
# This names our Rust module such that it is a submodule to the Python module.
module-name = "pyltree.pyltree_core"
