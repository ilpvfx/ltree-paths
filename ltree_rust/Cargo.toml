[package]
name = "ltree_rust"
version = "1.0.0-rc3"
edition = "2021"
description = "Parse, validate and join PostgreSQL ltree paths"
license = "MIT"
repository = "https://github.com/ilpvfx/ltree-paths"
keywords = ["ltree", "postgresql", "postgres", "path", "hierarchy"]
categories = ["database", "parser-implementations"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[dev-dependencies]
paste = "1.0.14"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
criterion = "0.5.1"
rand = { version = "0.8.5", features = ["small_rng", "alloc"] }

[[bench]]
name = "pathbench"
harness = false

[profile.release]
opt-level = 3
