[package]
name = "ltree_rust"
version = "1.0.0-rc2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[dev-dependencies]
paste = "1.0.14"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
criterion = "0.5.1"
rand = { version = "0.8.5", features = ["small_rng", "alloc"] }

[[bench]]
name = "pathbench"
harness = false

[profile.release]
opt-level = 3
